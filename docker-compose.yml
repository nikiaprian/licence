services:
  license:
    build: .
    ports:
      - "${PORT:-39217}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di file .env}
      EA_API_TOKEN: ${EA_API_TOKEN:?isi EA_API_TOKEN di file .env}
      ADDR: ":8080"
      DATA_DIR: /data
    volumes:
      - license-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  license-data:
